name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install -e ".[dev]" pytest-mock pytest-cov

      - name: Run tests
        run: uv run pytest tests/ -v --cov=langgraph2slack --cov-report=term-missing

      - name: Lint
        run: |
          uv run ruff check langgraph2slack/
          uv run black --check langgraph2slack/
