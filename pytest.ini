[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async test configuration (critical for async tests)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test markers for categorization
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (slower, may involve mocking external services)

# Additional options: verbose, fail on unknown markers, short tracebacks, summary of all
# outcomes, colorized output. (Inline comments aren't allowed inside values.)
addopts = -v --strict-markers --tb=short -ra --color=yes
